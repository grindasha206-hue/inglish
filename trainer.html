<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажёр · Инглиш</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--cream:#FBF6EC;--paper:#FFFCF5;--ink:#2A2622;--ink-soft:#5c554c;--brick:#AD3B2C;--brick-dark:#8E2E22;--tab:#E2963F;--tab-dark:#C97B2A;--sage:#4F8F6D;--sage-bg:#E6F1EA;--coral:#D65B4A;--coral-bg:#FBE7E3;--gold:#CBA35C;--line:#E4DACB;--shadow:0 6px 18px rgba(42,38,34,.10)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 8%,rgba(203,163,92,.10),transparent 40%),var(--cream);color:var(--ink);font-family:'Manrope',sans-serif;line-height:1.5;padding-bottom:60px}
h1,h2,h3{font-family:'Fraunces',serif;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
header.top{background:linear-gradient(135deg,var(--brick),var(--brick-dark));color:#fff;padding:22px 0 16px}
header.top h1{font-size:26px}
header.top p{margin:4px 0 0;opacity:.9;font-size:14px}
.backlink{color:#fff;opacity:.85;text-decoration:none;font-size:13px;font-weight:700;display:inline-block;margin-bottom:6px}
.backlink:hover{opacity:1;text-decoration:underline}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700}
.view{display:none;padding-top:18px}.view.active{display:block}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.topic{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:.15s}
.topic:hover{border-color:var(--tab);box-shadow:var(--shadow)}
.topic .em{font-size:26px}
.topic h3{font-size:17px;margin:4px 0 2px;color:var(--brick-dark)}
.topic .meta{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--sage)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.btn{border:none;cursor:pointer;font:800 14px 'Manrope';padding:10px 20px;border-radius:24px;background:var(--brick);color:#fff;box-shadow:0 4px 10px rgba(173,59,44,.25)}
.btn.sec{background:transparent;color:var(--brick);border:1.5px solid var(--brick);box-shadow:none}
.btn.good{background:var(--sage)}
.btn:disabled{opacity:.45;cursor:default}
.panel{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.rule{background:var(--sage-bg);border-left:4px solid var(--sage);border-radius:10px;padding:10px 14px;font-size:14.5px;margin:10px 0}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--ink-soft)}
.prog .bar{flex:1;margin:0}
.q{font:700 22px 'Fraunces',serif;margin:14px 0}
.qtype{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft);font-weight:800}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);background:#fffdf8;border-radius:12px;padding:12px 16px;font:700 16px 'Manrope';cursor:pointer;text-align:left;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--tab)}
.opt.ok{background:var(--sage-bg);border-color:var(--sage)}
.opt.bad{background:var(--coral-bg);border-color:var(--coral)}
.typein{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:700 17px 'Manrope';background:#fffdf8;color:var(--ink)}
.typein:focus{outline:2px solid var(--tab);border-color:var(--tab)}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border-radius:12px}
.ans{background:#fffdf8;border:1.5px dashed var(--line)}
.chip{border:1.5px solid var(--tab-dark);background:#fff;border-radius:10px;padding:8px 14px;font:700 16px 'Manrope';cursor:pointer;color:var(--ink)}
.chip:hover{background:var(--tab);color:#fff}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:14.5px}
.fb.ok{background:var(--sage-bg);border:1.5px solid var(--sage)}
.fb.bad{background:var(--coral-bg);border:1.5px solid var(--coral)}
.fb b{font-weight:800}
.ibtn{border:1.5px solid var(--line);background:var(--cream);border-radius:8px;padding:4px 9px;font-size:15px;cursor:pointer}
.score{font:800 44px 'Fraunces',serif;color:var(--brick-dark)}
.cons h3{font-size:16px;margin:14px 0 6px}
.cons h3:first-child{margin-top:0}
.tg{display:flex;flex-wrap:wrap;gap:8px}
.tgb{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:20px;padding:7px 14px;font:700 13.5px 'Manrope';cursor:pointer}
.tgb.on{background:var(--tab);color:#fff;border-color:var(--tab-dark)}
.tgb small{display:block;font-weight:600;font-size:11px;opacity:.85}
.mini{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.sel{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font:700 14px 'Manrope';background:#fffdf8;color:var(--ink)}
.bigsay{font-size:34px;padding:10px 22px;border-radius:16px}
.sent{font:700 24px 'Fraunces',serif;background:var(--cream);border:1.5px dashed var(--line);border-radius:12px;padding:14px;margin:6px 0}
.fmtrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.fmtrow:last-child{border:none}
.fmtrow .nm{flex:1;font-weight:800;font-size:14.5px}
.fmtrow .nm small{display:block;font-weight:600;font-size:12px;color:var(--ink-soft)}
.fmtrow .av{font-size:12px;color:var(--ink-soft);min-width:70px;text-align:right}
.stp{display:flex;align-items:center;gap:4px}
.stp button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--tab-dark);background:#fff;color:var(--tab-dark);font:800 17px 'Manrope';cursor:pointer;line-height:1}
.stp button:hover{background:var(--tab);color:#fff}
.stp b{min-width:28px;text-align:center;font-size:16px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);padding:8px 16px;border-radius:20px;font:700 13.5px 'Manrope';cursor:pointer}
.tab.active{background:var(--tab);color:#fff;border-color:var(--tab-dark)}
.hrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.hrow:last-child{border:none}
.hsc{font:800 22px 'Fraunces',serif;color:var(--brick-dark);min-width:64px}
.hsc.g{color:var(--sage)}
.hmeta{flex:1;min-width:180px;font-size:13px;color:var(--ink-soft)}
.hmeta b{color:var(--ink);font-size:14px}
.ch{display:inline-block;background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11.5px;font-weight:700;margin:2px 3px 0 0}
.mist{margin:6px 0;padding:8px 12px;border-radius:10px;background:var(--coral-bg);font-size:14px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="backlink" href="index.html">← В кабинет</a>
  <h1>🏋️ Тренажёр по грамматике</h1>
  <p>Только то, что вы уже прошли: Units 1–7. Собери тренировку сам или иди по урокам.</p>
  <div class="stats" id="stats"></div>
</div></header>

<main class="wrap">
<div class="tabs" id="mainTabs"><button class="tab active" data-v="vHome">🛠 Конструктор</button><button class="tab" data-v="vHist">📈 История</button></div>
<section class="view active" id="vHome">
  <div class="panel cons">
    <h2 style="font-size:20px">🛠 Конструктор тренировки</h2>
    <h3>1. Темы <button class="btn sec" id="tAll" style="padding:3px 10px;font-size:11.5px">все</button> <button class="btn sec" id="tNone" style="padding:3px 10px;font-size:11.5px">очистить</button></h3>
    <div class="tg" id="cTopics"></div>
    <h3>2. Сколько заданий каждого типа</h3>
    <div id="cFmts"></div>
    <div class="row" style="margin:8px 0 0"><button class="btn sec" id="pEven" style="padding:5px 12px;font-size:12px">по 2 каждого</button><button class="btn sec" id="pDef" style="padding:5px 12px;font-size:12px">стандарт (10)</button><button class="btn sec" id="pZero" style="padding:5px 12px;font-size:12px">обнулить</button></div>
    <h3>3. Что брать</h3>
    <div class="row" style="margin:0">
      <select class="sel" id="cSrc"><option value="all">всё подряд (сначала ошибки и новые)</option><option value="err">только мои ошибки</option><option value="new">только ещё не решённые</option></select>
    </div>
    <div class="row"><button class="btn" id="cGo">▶ Начать</button><span class="mini" id="cInfo" style="align-self:center"></span></div>
  </div>
  <h2 style="font-size:19px;margin:20px 0 10px">Или по уроку</h2>
  <div class="grid" id="topics"></div>
</section>

<section class="view" id="vHist">
  <div class="panel" id="hSum"></div>
  <div class="panel" id="hList"></div>
</section>

<section class="view" id="vIntro">
  <div class="panel">
    <h2 id="iTitle"></h2>
    <div class="rule" id="iRule"></div>
    <div class="row"><button class="btn" id="iGo">Поехали →</button><button class="btn sec" id="iBack">Назад</button></div>
  </div>
</section>

<section class="view" id="vSess">
  <div class="panel">
    <div class="prog"><span id="sNum"></span><div class="bar"><i id="sBar" style="width:0"></i></div><button class="btn sec" id="sQuit" style="padding:4px 12px;font-size:12px">Выйти</button></div>
    <div class="qtype" id="sType" style="margin-top:12px"></div>
    <div class="q" id="sQ"></div>
    <div id="sBody"></div>
    <div class="fb hidden" id="sFb"></div>
    <div class="row"><button class="btn" id="sCheck">Проверить</button><button class="btn good hidden" id="sNext">Дальше →</button></div>
  </div>
</section>

<section class="view" id="vRes"><div class="panel" id="resBox"></div></section>
</main>

<script src="sync-core.js"></script>
<script src="tts.js"></script>
<script src="backend-config.js"></script>
<script src="gateway.js"></script>
<script src="site.js"></script>
<script src="trainer-extra.js"></script>
<script src="trainer-data.js"></script>
<script>
(async function(){
await authReady;
if(!currentUser){ location.replace("index.html"); return; }
try{ await refreshCapabilities(); }catch(e){}

const TOPICS = window.TRAINER_TOPICS || [];
const ITEMS = TOPICS.flatMap(t=>t.items);
const byTopic = Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().replace(/[’‘´`]/g,"'").replace(/[?.!,;:]/g,'').replace(/\s+/g,' ').trim();
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ===== озвучка: голос сайта, при сбое — голос браузера ===== */
function activeProvider(){
  try{
    const hasGroq = typeof serverCapabilities!=='undefined' && serverCapabilities.groq;
    const hasEleven = typeof serverCapabilities!=='undefined' && serverCapabilities.eleven && !!getSetting('elevenVoice');
    if(!hasGroq && !hasEleven) return null;
    const pref = getSetting('activeVoiceProvider');
    if(pref==='eleven' && hasEleven) return 'eleven';
    if(pref==='groq' && hasGroq) return 'groq';
    return hasGroq ? 'groq' : 'eleven';
  }catch(e){ return null; }
}
function browserSpeak(text,rate){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)) return res(false);
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=rate||1;
    const v=(speechSynthesis.getVoices()||[]); const pv=v.find(x=>x.lang==='en-GB')||v.find(x=>x.lang&&x.lang.startsWith('en')); if(pv) u.voice=pv;
    u.onend=()=>res(true); u.onerror=()=>res(false); speechSynthesis.speak(u);
  });
}
async function speak(text,rate){
  rate=rate||1;
  const p=activeProvider();
  if(!p) return browserSpeak(text,rate);
  try{ return await (p==='eleven' ? elevenSpeak(text,rate) : groqSpeak(text,rate)); }
  catch(e){ return browserSpeak(text,rate); }
}

/* ===== прогресс: на каждое задание {ok,bad,last,t} ===== */
const KEY = (typeof accountKey==='function') ? accountKey('trainer.v1') : 'english.trainer.v1';
let prog = {};
try{ prog = JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ prog={}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(prog)); }catch(e){} }
function record(id, ok){
  const p = prog[id] || (prog[id]={ok:0,bad:0,last:-1,t:0});
  if(ok) p.ok++; else p.bad++;
  p.last = ok?1:0; p.t = Date.now(); save();
}
const mistakesList = () => ITEMS.filter(it=>prog[it.id] && prog[it.id].last===0);

/* ===== форматы ===== */
const FMT = {
  C:{n:'Выбор',d:'выбери вариант'},
  F:{n:'Впиши',d:'напиши пропуск'},
  O:{n:'Собери',d:'слова по порядку'},
  T:{n:'Верно / ошибка',d:'найди неверное'},
  X:{n:'Исправь',d:'перепиши без ошибки'},
  D:{n:'Диктовка',d:'послушай и напиши'}
};
const ELIG = {C:['C','T','X','D'], F:['F','D'], O:['O','D']};
const elig = (it,fm)=>(it.nt?['C','D']:ELIG[it.type]).filter(f=>fm.includes(f));
const FM_KEYS = Object.keys(FMT);
const DEF_COUNTS = {C:3,F:2,O:1,T:2,X:1,D:1};
const CFG_KEY = (typeof accountKey==='function') ? accountKey('trainer.cfg2') : 'english.trainer.cfg2';
let cfg = {topics:TOPICS.map(t=>t.id), counts:{...DEF_COUNTS}, src:'all'};
try{ const c=JSON.parse(localStorage.getItem(CFG_KEY)||'null'); if(c){ cfg.topics=(c.topics||[]).filter(id=>byTopic[id]); FM_KEYS.forEach(k=>{ cfg.counts[k]=Math.max(0,Math.min(50,+((c.counts||{})[k]))||0); }); cfg.src=c.src||'all'; } }catch(e){}
function saveCfg(){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){} }
const total = c=>FM_KEYS.reduce((a,k)=>a+(c.counts[k]||0),0);
const activeFmts = c=>FM_KEYS.filter(k=>(c.counts[k]||0)>0);

function poolFor(c){
  let items = c.items || ITEMS.filter(it=>c.topics.includes(it.topic));
  if(c.src==='err') items = items.filter(it=>prog[it.id]&&prog[it.id].last===0);
  if(c.src==='new') items = items.filter(it=>!prog[it.id]);
  return items;
}

/* ===== главная ===== */
function topicStat(t){
  const n=t.items.length; let mastered=0, ok=0, bad=0;
  t.items.forEach(it=>{ const p=prog[it.id]; if(p){ if(p.last===1) mastered++; ok+=p.ok; bad+=p.bad; } });
  return {n, mastered, acc: ok+bad ? Math.round(100*ok/(ok+bad)) : null};
}
function availFor(f,pool){ return pool.filter(it=>elig(it,[f]).length).length; }
function renderCons(){
  $('cTopics').innerHTML = TOPICS.map(t=>`<button class="tgb ${cfg.topics.includes(t.id)?'on':''}" data-t="${t.id}">${t.emoji} ${esc(t.title)}</button>`).join('');
  const pool = poolFor(cfg);
  $('cFmts').innerHTML = FM_KEYS.map(k=>{
    const av=availFor(k,pool), n=cfg.counts[k]||0;
    return `<div class="fmtrow"><div class="nm">${FMT[k].n}<small>${FMT[k].d}</small></div><div class="av">доступно: ${av}</div><div class="stp"><button data-m="${k}">−</button><b style="${n>av?'color:var(--coral)':''}">${n}</b><button data-p="${k}">+</button></div></div>`;
  }).join('');
  $('cSrc').value = cfg.src;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ const id=+b.dataset.t; cfg.topics = cfg.topics.includes(id)?cfg.topics.filter(x=>x!==id):[...cfg.topics,id]; saveCfg(); renderCons(); });
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ const k=b.dataset.m; cfg.counts[k]=Math.max(0,(cfg.counts[k]||0)-(cfg.counts[k]>5?5:1)); saveCfg(); renderCons(); });
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const k=b.dataset.p; cfg.counts[k]=Math.min(50,(cfg.counts[k]||0)+((cfg.counts[k]||0)>=5?5:1)); saveCfg(); renderCons(); });
  const tot=total(cfg);
  const lack = FM_KEYS.filter(k=>(cfg.counts[k]||0)>availFor(k,pool));
  $('cInfo').textContent = !cfg.topics.length ? 'Выбери хотя бы одну тему' : !tot ? 'Задай количество хотя бы для одного типа' : !pool.length ? 'Под такие настройки заданий нет — измени фильтр' : `Всего в тренировке: ${tot}`+(lack.length?` · не хватает заданий типа: ${lack.map(k=>FMT[k].n).join(', ')} (возьму сколько есть)`:'');
  $('cGo').disabled = !cfg.topics.length || !tot || !pool.length;
}
function renderHome(){
  let tOk=0,tBad=0; Object.values(prog).forEach(p=>{tOk+=p.ok;tBad+=p.bad;});
  const m = mistakesList().length;
  $('stats').innerHTML = `<span class="pill">Заданий: ${ITEMS.length}</span><span class="pill">Ответов: ${tOk+tBad}</span><span class="pill">Точность: ${tOk+tBad?Math.round(100*tOk/(tOk+tBad))+'%':'—'}</span><span class="pill">Ошибок к разбору: ${m}</span>`;
  renderCons();
  $('topics').innerHTML = TOPICS.map(t=>{
    const s=topicStat(t);
    return `<button class="topic" data-id="${t.id}"><div class="em">${t.emoji}</div><h3>${esc(t.title)}</h3><div class="meta">Верно сейчас: ${s.mastered} из ${s.n}${s.acc!=null?' · точность '+s.acc+'%':''}</div><div class="bar"><i style="width:${Math.round(100*s.mastered/s.n)}%"></i></div></button>`;
  }).join('');
  document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>openIntro(byTopic[b.dataset.id]));
}
function show(id){ $('mainTabs').classList.toggle('hidden', !(id==='vHome'||id==='vHist')); document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0,0); }
$('tAll').onclick = ()=>{ cfg.topics=TOPICS.map(t=>t.id); saveCfg(); renderCons(); };
$('tNone').onclick = ()=>{ cfg.topics=[]; saveCfg(); renderCons(); };
$('cSrc').onchange = e=>{ cfg.src=e.target.value; saveCfg(); renderCons(); };
$('pEven').onclick = ()=>{ FM_KEYS.forEach(k=>cfg.counts[k]=2); saveCfg(); renderCons(); };
$('pDef').onclick = ()=>{ cfg.counts={...DEF_COUNTS}; saveCfg(); renderCons(); };
$('pZero').onclick = ()=>{ FM_KEYS.forEach(k=>cfg.counts[k]=0); saveCfg(); renderCons(); };
$('cGo').onclick = ()=>startSession({...cfg, counts:{...cfg.counts}}, 'Моя тренировка');

/* ===== вступление к теме (урок) ===== */
function openIntro(t){
  $('iTitle').textContent = t.emoji+' '+t.title;
  $('iRule').innerHTML = '<b>Правило.</b> '+esc(t.rule)+`<div class="mini">Типы и число заданий — как в конструкторе: ${activeFmts(cfg).map(k=>FMT[k].n+' ×'+cfg.counts[k]).join(', ')||'не заданы'}.</div>`;
  $('iGo').onclick = ()=>{ if(!total(cfg)) return alert('Задай количество заданий в конструкторе'); startSession({...cfg, counts:{...cfg.counts}, topics:[t.id], src:'all'}, t.title); };
  $('iBack').onclick = ()=>{ renderHome(); show('vHome'); };
  show('vIntro');
}

/* ===== сессия ===== */
let S=null;
function startSession(c,title){
  const rank = it=>{ const p=prog[it.id]; if(!p) return 1; return p.last===0 ? 0 : 2; };
  let list=[];
  if(c.items){
    const af = activeFmts(c);
    list = c.items.map(it=>({it, fmt:(shuffle(elig(it,af))[0]||shuffle(elig(it,FM_KEYS))[0])}));
  }else{
    const pool = poolFor(c), used=new Set();
    activeFmts(c).sort((a,b)=>availFor(a,pool)-availFor(b,pool)).forEach(f=>{
      let cand = shuffle(pool.filter(it=>elig(it,[f]).length)).sort((a,b)=>rank(a)-rank(b));
      const fresh = cand.filter(it=>!used.has(it.id));
      const take = fresh.concat(cand.filter(it=>used.has(it.id))).slice(0,c.counts[f]);
      take.forEach(it=>{ used.add(it.id); list.push({it,fmt:f}); });
    });
  }
  if(!list.length) return;
  S={title, c, items:shuffle(list), i:0, right:0, wrong:[], byFmt:{}, started:Date.now()};
  show('vSess'); renderItem();
}
function filled(it){
  if(it.type==='O') return it.s;
  const a = it.type==='C' ? it.a : it.a[0];
  if(!/___/.test(it.q)) return a;
  return it.q.replace(/\s*\([^)]*\)/g,'').replace('___',a);
}
function withOpt(it,o){ return /___/.test(it.q) ? it.q.replace('___',o) : o; }
const TYPE_LABEL={C:'Выбери вариант',F:'Впиши слово',O:'Собери предложение',T:'Верно или ошибка?',X:'Исправь ошибку',D:'Диктовка'};
let cur=null;
function renderItem(){
  const {it,fmt}=S.items[S.i]; cur={it, fmt, answered:false, built:[], bank:[]};
  $('sNum').textContent = `${S.i+1} / ${S.items.length}`;
  $('sBar').style.width = (100*S.i/S.items.length)+'%';
  $('sType').textContent = TYPE_LABEL[fmt]+' · '+byTopic[it.topic].title;
  $('sFb').classList.add('hidden'); $('sNext').classList.add('hidden'); $('sCheck').classList.remove('hidden'); $('sCheck').disabled=false;
  const body=$('sBody');
  if(fmt==='C'){
    $('sQ').textContent = it.q;
    $('sCheck').classList.add('hidden');
    body.innerHTML = '<div class="opts">'+shuffle(it.opts).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')+'</div>';
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(b.dataset.v===it.a, b));
  }else if(fmt==='F'){
    $('sQ').textContent = it.q;
    body.innerHTML = '<input class="typein" id="fIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="впиши пропуск">';
    $('fIn').focus();
  }else if(fmt==='O'){
    $('sQ').textContent = 'Расставь слова по порядку';
    cur.bank = shuffle(it.s.split(/\s+/));
    if(cur.bank.join(' ')===it.s) cur.bank = shuffle(cur.bank);
    drawOrder();
  }else if(fmt==='T'){
    cur.isTrue = Math.random()<.5;
    cur.shown = cur.isTrue ? filled(it) : withOpt(it, shuffle(it.opts.filter(o=>o!==it.a))[0]);
    $('sQ').textContent = 'Это предложение правильное?';
    $('sCheck').classList.add('hidden');
    body.innerHTML = `<div class="sent">${esc(cur.shown)}</div><div class="row" style="margin:8px 0 0"><button class="btn good" data-tf="1">✅ Верно</button><button class="btn" data-tf="0">❌ Есть ошибка</button></div>`;
    body.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>finish((b.dataset.tf==='1')===cur.isTrue));
  }else if(fmt==='X'){
    cur.shown = withOpt(it, shuffle(it.opts.filter(o=>o!==it.a))[0]);
    $('sQ').textContent = 'В предложении ошибка. Перепиши его правильно:';
    body.innerHTML = `<input class="typein" id="fIn" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    $('fIn').value = cur.shown; $('fIn').focus();
  }else{ /* D */
    $('sQ').textContent = 'Послушай и напиши, что услышала';
    body.innerHTML = `<div class="row" style="margin:0 0 10px"><button class="btn bigsay" id="dSay">🔊</button><button class="btn sec" id="dSlow">🐢 Медленно</button></div><input class="typein" id="fIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="напиши предложение">`;
    const t=filled(it);
    $('dSay').onclick=()=>speak(t,1); $('dSlow').onclick=()=>speak(t,.7);
    $('fIn').focus(); speak(t,1);
  }
}
function drawOrder(){
  $('sBody').innerHTML = `<div class="chips ans" id="oAns">${cur.built.map((w,i)=>`<button class="chip" data-a="${i}">${esc(w)}</button>`).join('')}</div><div class="chips" id="oBank">${cur.bank.map((w,i)=>`<button class="chip" data-b="${i}">${esc(w)}</button>`).join('')}</div>`;
  if(cur.answered) return;
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{ cur.built.push(cur.bank.splice(+b.dataset.b,1)[0]); drawOrder(); });
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ cur.bank.push(cur.built.splice(+b.dataset.a,1)[0]); drawOrder(); });
}
function check(){
  if(cur.answered) return;
  const {it,fmt}=cur;
  if(fmt==='F'){
    const v=norm($('fIn').value); if(!v) return;
    finish(it.a.some(a=>norm(a)===v));
  }else if(fmt==='O'){
    if(!cur.built.length) return;
    const v=norm(cur.built.join(' '));
    finish([it.s,...it.alt].some(a=>norm(a)===v));
  }else if(fmt==='X' || fmt==='D'){
    const v=norm($('fIn').value); if(!v) return;
    const good = it.type==='O' ? [it.s,...it.alt] : [filled(it), ...(it.type==='F' ? it.a.map(a=>filled({...it,a:[a]})) : [])];
    finish(good.some(a=>norm(a)===v));
  }
}
function finish(ok, btn){
  const {it,fmt}=cur; cur.answered=true;
  record(it.id, ok);
  const bf=S.byFmt[fmt]||(S.byFmt[fmt]=[0,0]); bf[1]++; if(ok) bf[0]++;
  if(ok) S.right++; else S.wrong.push(it);
  if(fmt==='C'){
    document.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; if(b.dataset.v===it.a) b.classList.add('ok'); else if(b===btn) b.classList.add('bad'); });
  }else if(fmt==='T'){ document.querySelectorAll('[data-tf]').forEach(b=>b.disabled=true); }
  else if(fmt==='O'){ drawOrder(); }
  else { $('fIn').disabled=true; }
  const sent = filled(it);
  let head;
  if(ok) head = '✅ <b>Верно!</b>' + (fmt==='T' && !cur.isTrue ? ' Правильно: <b>'+esc(sent)+'</b>' : '');
  else if(fmt==='T') head = cur.isTrue ? '❌ <b>Это предложение верное:</b> '+esc(sent) : '❌ <b>Тут ошибка.</b> Правильно: <b>'+esc(sent)+'</b>';
  else head = '❌ <b>Не совсем.</b> Правильно: <b>'+esc(sent)+'</b>';
  $('sFb').className = 'fb '+(ok?'ok':'bad');
  $('sFb').innerHTML = head + ` <button class="ibtn" id="fbSay" title="Озвучить">🔊</button>`
    + (ok?'':`<div style="margin-top:6px;color:var(--ink-soft)">Правило: ${esc(byTopic[it.topic].rule)}</div>`);
  $('fbSay').onclick = ()=>speak(sent);
  $('sCheck').classList.add('hidden'); $('sNext').classList.remove('hidden'); $('sNext').focus();
  if(ok && fmt!=='D') speak(sent);
}
function next(){
  S.i++;
  if(S.i>=S.items.length) return results();
  renderItem();
}
function results(){
  const n=S.items.length, pct=Math.round(100*S.right/n);
  const msg = pct===100?'Безупречно! 🎉':pct>=80?'Отлично!':pct>=60?'Хорошо, но есть над чем поработать.':'Ничего страшного — ошибки и есть тренировка.';
  const c=S.c, wrong=S.wrong, title=S.title;
  addHist({t:Date.now(), title, topics:[...new Set(S.items.map(x=>x.it.topic))], right:S.right, n, byFmt:S.byFmt, wrong:wrong.map(w=>w.id), sec:Math.round((Date.now()-S.started)/1000)});
  $('resBox').innerHTML = `<div class="qtype">${esc(title)}</div><div class="score">${S.right} / ${n}</div><p>${msg}</p>`
    + (wrong.length ? '<h3 style="margin:14px 0 6px">Разбор ошибок</h3>'+wrong.map(it=>`<div class="mist">${esc(filled(it))} <button class="ibtn" data-say="${esc(filled(it))}">🔊</button></div>`).join('') : '')
    + `<div class="row"><button class="btn" id="rAgain">Ещё раз</button>`
    + (wrong.length?`<button class="btn sec" id="rMist">Повторить ошибки</button>`:'')
    + `<button class="btn sec" id="rHome">В конструктор</button></div>`;
  $('rAgain').onclick = ()=>startSession(c,title);
  if(wrong.length) $('rMist').onclick = ()=>startSession({...c, items:wrong, src:'all'},'Работа над ошибками');
  $('rHome').onclick = ()=>{ renderHome(); setTab('vHome'); };
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speak(b.dataset.say));
  show('vRes');
}

/* ===== история ===== */
const HKEY = (typeof accountKey==='function') ? accountKey('trainer.hist') : 'english.trainer.hist';
let hist=[]; try{ hist=JSON.parse(localStorage.getItem(HKEY)||'[]')||[]; }catch(e){ hist=[]; }
function addHist(h){ hist.unshift(h); hist=hist.slice(0,200); try{ localStorage.setItem(HKEY, JSON.stringify(hist)); }catch(e){} }
const byId = Object.fromEntries(ITEMS.map(i=>[i.id,i]));
function fmtDur(s){ return s<60 ? s+' с' : Math.floor(s/60)+' мин '+(s%60)+' с'; }
function renderHist(){
  const n=hist.length;
  if(!n){ $('hSum').innerHTML='<h2 style="font-size:19px">📈 История</h2><p class="mini">Пока пусто. После первой тренировки здесь появятся результаты.</p>'; $('hList').classList.add('hidden'); return; }
  $('hList').classList.remove('hidden');
  let r=0,t=0; const f={}; hist.forEach(h=>{ r+=h.right; t+=h.n; Object.entries(h.byFmt||{}).forEach(([k,v])=>{ const a=f[k]||(f[k]=[0,0]); a[0]+=v[0]; a[1]+=v[1]; }); });
  $('hSum').innerHTML = `<h2 style="font-size:19px">📈 История</h2><div class="stats" style="margin:8px 0"><span class="pill" style="background:var(--cream);color:var(--ink)">Тренировок: ${n}</span><span class="pill" style="background:var(--cream);color:var(--ink)">Ответов: ${t}</span><span class="pill" style="background:var(--cream);color:var(--ink)">Верно: ${Math.round(100*r/t)}%</span></div>`
    + '<div class="mini" style="margin-bottom:4px">Точность по типам заданий:</div>'
    + FM_KEYS.filter(k=>f[k]).map(k=>{ const p=Math.round(100*f[k][0]/f[k][1]); return `<div class="fmtrow"><div class="nm" style="font-size:13.5px">${FMT[k].n}</div><div class="bar" style="flex:1;margin:0"><i style="width:${p}%"></i></div><div class="av">${p}% (${f[k][0]}/${f[k][1]})</div></div>`; }).join('')
    + '<div class="mini" style="margin:10px 0 4px">Точность по темам (по последним ответам на каждое задание):</div>'
    + TOPICS.map(tp=>{ const s=topicStat(tp); return `<div class="fmtrow"><div class="nm" style="font-size:13.5px">${tp.emoji} ${esc(tp.title)}</div><div class="bar" style="flex:1;margin:0"><i style="width:${Math.round(100*s.mastered/s.n)}%"></i></div><div class="av">${s.mastered}/${s.n}</div></div>`; }).join('')
    + `<div class="row"><button class="btn sec" id="hClear" style="padding:5px 12px;font-size:12px">Очистить историю</button></div>`;
  $('hList').innerHTML = hist.slice(0,50).map((h,i)=>{
    const pct=Math.round(100*h.right/h.n), d=new Date(h.t);
    const when=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    const chips=Object.entries(h.byFmt||{}).map(([k,v])=>`<span class="ch">${FMT[k]?FMT[k].n:k}: ${v[0]}/${v[1]}</span>`).join('');
    const tn=(h.topics||[]).map(id=>byTopic[id]?byTopic[id].title:'').filter(Boolean).join(', ');
    const wr=(h.wrong||[]).filter(id=>byId[id]);
    return `<div class="hrow"><div class="hsc ${pct>=80?'g':''}">${h.right}/${h.n}</div><div class="hmeta"><b>${esc(h.title)}</b> · ${when}${h.sec?' · '+fmtDur(h.sec):''}<br>${esc(tn)}<br>${chips}</div>${wr.length?`<button class="btn sec" data-hr="${i}" style="padding:5px 12px;font-size:12px">Повторить ошибки (${wr.length})</button>`:''}</div>`;
  }).join('');
  document.querySelectorAll('[data-hr]').forEach(b=>b.onclick=()=>{ const h=hist[+b.dataset.hr]; startSession({counts:{...cfg.counts}, items:h.wrong.map(id=>byId[id]).filter(Boolean)},'Работа над ошибками'); });
  if($('hClear')) $('hClear').onclick=()=>{ if(confirm('Стереть историю тренировок? Прогресс по темам останется.')){ hist=[]; try{ localStorage.removeItem(HKEY); }catch(e){} renderHist(); } };
}
function setTab(v){
  document.querySelectorAll('#mainTabs .tab').forEach(b=>b.classList.toggle('active', b.dataset.v===v));
  $('mainTabs').classList.remove('hidden');
  if(v==='vHist') renderHist(); else renderHome();
  show(v);
}
document.querySelectorAll('#mainTabs .tab').forEach(b=>b.onclick=()=>setTab(b.dataset.v));

$('sCheck').onclick = check;
$('sNext').onclick = next;
$('sQuit').onclick = ()=>{ if(confirm('Выйти из сессии? Ответы, которые уже даны, сохранены.')){ renderHome(); show('vHome'); } };
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter' || !$('vSess').classList.contains('active')) return;
  if(!$('sNext').classList.contains('hidden')) next(); else check();
});

renderHome();
})();
</script>
</body>
</html>
